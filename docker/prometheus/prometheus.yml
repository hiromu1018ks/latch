global:
  scrape_interval: 15s

# targetはstagingのcomposeネットワーク内のコンテナ名直結
# (compose.dashboard.yamlのstaging-obsネットワーク参加を参照。apiコンテナ内
# ポート8000・worker内ポート9100)
scrape_configs:
  - job_name: latch-staging-api
    static_configs:
      - targets:
          - "api1:8000"
          - "api2:8000"
  - job_name: latch-staging-worker
    static_configs:
      - targets:
          - "worker1:9100"
          - "worker2:9100"
  - job_name: prometheus
    static_configs:
      - targets:
          - "localhost:9090"
