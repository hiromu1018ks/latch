global:
  scrape_interval: 15s

scrape_configs:
  - job_name: latch-staging-api
    static_configs:
      - targets:
          - "host.docker.internal:18001"
          - "host.docker.internal:18002"
  - job_name: latch-staging-worker
    static_configs:
      - targets:
          - "host.docker.internal:18101"
          - "host.docker.internal:18102"
  - job_name: prometheus
    static_configs:
      - targets:
          - "localhost:9090"
