adopted_path: A
adoption: 'A: Python Workers主体(routes・Pydantic・純粋計算・promptを再利用し、D1/通信/job adapterを交換)'
blockers: []
notes:
- cryptography/pyjwt/anthropic/google-genai/typesafe-sdk は pywrangler(pyodide 3.14.2)でimport可能
  — 2026-10-06調査書の「cryptography wheel不在」は新toolchainで解消済み
- RS256検証は従来経路(pyjwt+cryptography)がそのまま動く。純Python fallback(検証のみ)も実証済み
- JWKS取得は asyncio.to_thread 不可のため async fetch へ交換(self-fetch mockで実証)
- D1 batch()は準備済みSQL群の原子的実行・0行UPDATEはSQLエラーなし
- Queuesは producer/consumer 同一workerで送受+ack実証(payloadはJSON文字列で送る規律をT5で確定)
- scheduled handlerは /cdn-cgi/local/scheduled で起動実証
- 本実測はローカル(pywrangler dev)。実配備での性能・制限は別承認後
