findings:  # 実配備で発見した差異(重要)
  - "scheduled/queueハンドラのenvはself.env(引数envはNone) — localのminiflareでは引数が入る差"
  - "D1 .all()はD1Result{success,meta,results}を返し行はresults内 — localは行配列(.first()は同一に動作)"
  - "本番マルチisolateではメモリ内グローバルが共有されない — scheduled/queue記録はD1永続化が必須(§2.3規律の実証)"
  - "workers.devドメインへの自己subrequestは404 — 自己fetchにはservice bindingかカスタムドメインが必要(外部URLへのfetchは影響なし)"
  - "JsProxy経由の値はstr()/int()で明示変換(json.loads等の型要求に注意)"
