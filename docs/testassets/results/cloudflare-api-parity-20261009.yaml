implementation_notes:
  - routes・schemas・domain計算・errors・例外ハンドラは backend/src/latch をそのまま再利用
  - 認証: 純Python jwt shim(jwt_pure)で auth/tokens.py・idp.py を原改変なし実行
    (実pyjwt発行RS256の検証相互運用をCPython側で実証済み)
  - 書込: adapters/d1/atomic.apply_intent/apply_response/apply_safety(command marker+outbox)
  - 読込: latch_worker/svc_*.py に参照実装と同一SQL意味のD1読取を実装
  - レート制限: RateLimiter本体 + D1RateLimitStore(usage_counters 1行upsert INCR)
  - session: D1SessionStore → auth.SessionStore 意味論adapter(回転・再利用検出・失効)
  - LLM: StubLLMのみ(実LLM呼出しは承認待ちのまま・外部送信なし)
  - probe差異5件への対応: self.env(scheduled/queue)・.all() D1Result正規化
    (RealD1Binding)・D1永続化・自己subrequest不使用・JsProxy明示変換
