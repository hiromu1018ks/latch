# 要確認1(P-003・P-007「夜」のみの時刻丸め)
#   07 §2規則2は「20時以降」のような時刻を伴う表現の丸めのみ定義し、「夜」
#   単独の開始時刻を定めていない。草案は10 §2の時間帯分布「夜20–23時」を
#   根拠に20:00とした。19:00や「時間帯情報なし(422寄り)」という解釈も
#   可能なため、確定時に方針を定めたい(「夜」=20:00を規則に明記するか)。
#
# 要確認2(P-004「2人くらい」単独の人数丸め)
#   07 §2規則2の人数丸めは「2〜4人くらい」(幅)と「3人以上なら」(下限)の
#   2形式のみ。「N人くらい」単独は未定義。草案は「くらい」の幅を実質1対1
#   (min=2, max=2)と解したが、min=2, max=null(上限言及なし)または
#   min=2, max=4(システム上限へ切る)も解釈として可能。
#
# 要確認3(P-018「30分くらいなら食べられる」のend扱い)
#   「終了時刻は推測しない」(07規則2)の適用線引き。所要時間の言及を
#   end=13:00へ反映する解釈もある。草案はend=nullとし所要時間をsoft側に
#   置く(推測に当たる情報でhard側を強めない)。ソフト側の期待値は本セット
#   の測定対象外のため、endの判定のみがこのケースの争点。
#
# 要確認4(P-031「午後」のみの時刻丸め)
#   「午後」は12:00〜夕方までの幅で、10 §2の分布定義(昼12–13時/夕18–20時)
#   のいずれにも収まらない。草案は13:00(昼枠の直後)としたが、14:00や
#   15:00も解釈可能。「午後」の既定時刻を規則に定めるか、flexibility_minutes
#   が有効化される将来まで測定対象から外すかの判断が残る。
#
# 共通の判断(フラグなし・参考)
#   - 「昼」「ランチ」→12:00、「夜」→20:00 は10 §2の分布表現を根拠に
#     草案している(要確認フラグを付けたのは「夜」と「午後」で、「昼」は
#     P-019・P-027の注記にとどめた)
#   - locationは地名・ランドマークをそのまま残す規則(07規則4)に基づき、
#     「天文館の居酒屋」「天文館あたり」からは地域名を抽出した
#   - E-002のparticipants抽出可否は、422応答のペイロード設計(05)の参照用
# ==========================================================================
