# 必須3フィールド(category / time.start / location.name、07 §2)が揃わない入力。
# 一致率の集計対象外。Parserが正しく422を返すこと(フォームフォールバックの起動、
# 07 D-17)を確認する。E-001・E-002は01第6節の典型表現そのもの。

error_cases:
  - id: E-001
    text: "今日誰かと飲みたい"
    author_age: null
    expected:
      error: "422 VALIDATION_ERROR"
      missing: [time.start, location.name]
      category_extractable: drinking
    needs_review: false
    note: "01第6節の典型表現(そのまま収録)。category・相対日付(今日)は読み取れるが、必須3フィールドが揃わないため422"

  - id: E-002
    text: "3人以上なら焼肉に行きたい"
    author_age: null
    expected:
      error: "422 VALIDATION_ERROR"
      missing: [time.start, location.name]
      category_extractable: meal
      participants_extractable: {min: 3, max: 4}
    needs_review: false
    note: "01第6節の典型表現(そのまま収録)。participantsは抽出可能(「3人以上なら」→min=3, max=4)だが保存には至らない"

