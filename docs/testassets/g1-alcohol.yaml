# ==========================================================================
# 要確認まとめ(needs_review: true の理由)
#
# 要確認1(A-033「ノンアルコールビール」)
#   07 §2規則7は「飲酒を示す語(飲む・飲み・酒・呑む・バー・ビール・
#   サワー等)があればtrue」「アルコールを指さない用法(コーヒーを飲む等)
#   はfalse」という語彙検出と意味判断の混合規則。「ノンアルコールビール」
#   は「ビール」の語を含むがアルコールを指さない。草案はfalse(意味優先)。
#   true(語彙優先)とする場合、規則7の文言を「語の包含」に寄せて明記する
#   必要がある。いずれにせよ規則の適用線引きを確定する代表ケース。
#
# 要確認2(A-034「barでコーラだけ」)
#   語彙検出では「バー」によりtrue。一方で本人の飲酒意図はなく、08 D-10
#   の保護目的(未成年への飲酒機会の提供)からは、酒を提供する場への流入
#   をtrue側で抑えるのが安全という見方もある。草案は規則どおりtrue。
#   falseとする判断も可能で、確定時に方針を定めたい。
#
# 判断に迷ったがフラグを見送った点(参考)
#   - A-009「0次会」「一杯」: 「0次会」自体は語彙リスト外だが、同文中の
#     「一杯」が飲酒の慣用として成立するためtrueとした
#   - A-019「私は飲まないけど」: 本人の飲酒意図は否定だが、場の飲酒を
#     示す語があり規則どおりtrue。18〜19歳の流入防止の趣旨とも整合
#   - A-025「ドリンクバー」: ソフトドリンクの慣用としてfalse
#   - A-036「乾杯」: 対象(ジュース)がアルコールを指さないためfalse。
#     precision測定の効く負例として設計
# ==========================================================================
