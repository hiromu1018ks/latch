# ダッシュボード環境(M4 ws-4)。別プロジェクトlatch-dashboard。
# Prometheusがstagingのメトリクスをscrapeし、Grafanaへdatasourceを
# provisioningする。scrape経路はstagingのcomposeネットワーク(latch-staging_default)
# への参加によるコンテナ名直結(実施時にhost-gateway経由ではホストの
# 127.0.0.1バインドポートへ届かないため変更・報告書に記録)。ホスト公開
# ポートの127.0.0.1明示バインド(承認事項4)は本ファイルのportsで維持する。
# load環境(28000系)のtargetもprometheus.ymlへ追加した(ws-6)。scrape経路は
# loadのcomposeネットワーク(latch-load_default)への参加+load側コンテナの
# 別名(load-api1等・同一ネットワーク名のDocker DNSあいまい解決を避ける)。
name: latch-dashboard

services:
  prometheus:
    # prom/prometheusの実在安定タグ。pull失敗時は安定版に読み替えて
    # 報告書に記録する(§0固定値の遵守)
    image: prom/prometheus:v3.0.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:19090:9090"
    networks:
      - default
      - staging-obs
      - load-obs
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.4.0
    environment:
      # ローカル確認用の初期ログイン(127.0.0.1のみ公開・stagingはローカル
      # docker composeの別プロジェクト)
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:13000:3000"
    restart: unless-stopped

networks:
  # stagingのcomposeが作る既定ネットワーク(コンテナ名直結scrape用・external)
  staging-obs:
    external: true
    name: latch-staging_default
  # loadのcomposeが作る既定ネットワーク(ws-6・external。load-up後に存在する
  # ため起動順序は load-up → dashboard-up。dashboard稼働中にload-upした場合は
  # prometheus再起動〔dashboard-down/up〕を手順§8で明示する)
  load-obs:
    external: true
    name: latch-load_default
