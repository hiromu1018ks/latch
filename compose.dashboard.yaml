# ダッシュボード環境(M4 ws-4)。別プロジェクトlatch-dashboard。
# Prometheusがstagingのメトリクスをscrapeし、Grafanaへdatasourceを
# provisioningする。scrape経路はstagingのcomposeネットワーク(latch-staging_default)
# への参加によるコンテナ名直結(実施時にhost-gateway経由ではホストの
# 127.0.0.1バインドポートへ届かないため変更・報告書に記録)。ホスト公開
# ポートの127.0.0.1明示バインド(承認事項4)は本ファイルのportsで維持する。
# load環境(28000系)のtargetはws-6(性能測定)が追加する(design §3.1どおり
# staging系のみの初期構成)。
name: latch-dashboard

services:
  prometheus:
    # prom/prometheusの実在安定タグ。pull失敗時は安定版に読み替えて
    # 報告書に記録する(§0固定値の遵守)
    image: prom/prometheus:v3.0.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:19090:9090"
    networks:
      - default
      - staging-obs
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.4.0
    environment:
      # ローカル確認用の初期ログイン(127.0.0.1のみ公開・stagingはローカル
      # docker composeの別プロジェクト)
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:13000:3000"
    restart: unless-stopped

networks:
  # stagingのcomposeが作る既定ネットワーク(コンテナ名直結scrape用・external)
  staging-obs:
    external: true
    name: latch-staging_default
