# Cloudflare API Worker(T1互換性probe用・2026-10-08移行計画 §6 T1)
#
# バンドルは最小構成(fastapi/pydantic)。LLM SDKのimport互換はローカルで
# 検証済み(cloudflare-runtime-probe-20261008-142457.yaml)ためデプロイから
# は除外(バンドル上限 10MB gzip)。
[project]
name = "latch-api-worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "workers-py>=1.9",
    "workers-runtime-sdk",
]
