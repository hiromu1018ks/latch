# Cloudflare API Worker(T1互換性probe用・2026-10-08移行計画 §6 T1)

# 本番依存(latch本体)をここへ入れてはならない(計画T1: 「現行一式を
# Workersの依存としてinstallしない」)。probeは最小構成で互換面を測る。
# wrangler 4.148はrequirements.txtを使わず、ここ(pyproject)と
# pywrangler(workers-py添付)で依存を解決する。
[project]
name = "latch-api-worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    # T1 probe: 既存LLM/ユーティリティ依存のWorkers互換を測る
    # (import確認のみ・通信はしない)。latch本体一式ではない。
    "pyjwt>=2.10",
    "pyyaml>=6.0.3",
    "httpx>=0.27",
    "anthropic>=1.8.0",
    "google-genai>=1.33",
    "typesafe-sdk>=0.7.2",
]

[dependency-groups]
dev = [
    "workers-py>=1.9",
    "workers-runtime-sdk",
]
